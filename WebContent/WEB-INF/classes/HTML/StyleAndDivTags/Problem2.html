<!DOCTYPE html>
<html>
<head>
    <title>Forms using Div</title>

    <style>
        .box{
            border:1px solid black;
            width:350px;
            padding:20px;
            margin:20px;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Registration Form</h2>

    <form>
        Name:
        <input type="text"><br><br>

        Email:
        <input type="email"><br><br>

        Password:
        <input type="password"><br><br>

        <input type="submit" value="Register">
    </form>
</div>

<div class="box">
    <h2>Login Form</h2>

    <form>
        Username:
        <input type="text"><br><br>

        Password:
        <input type="password"><br><br>

        <input type="submit" value="Login">
    </form>
</div>

</body>
</html>
