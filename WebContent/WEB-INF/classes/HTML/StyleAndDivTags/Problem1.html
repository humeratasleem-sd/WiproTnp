<!DOCTYPE html>
<html>
<head>
    <title>Table</title>
    <style>
        body{
            font-family: "Times New Roman", Times, serif;
        }

        table{
            border-collapse: collapse;
            width: 50%;
        }

        table, th, td{
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

<table>
    <tr>
        <th>Roll No</th>
        <th>Name</th>
        <th>Marks</th>
    </tr>
    <tr>
        <td>101</td>
        <td>Syed</td>
        <td>95</td>
    </tr>
    <tr>
        <td>102</td>
        <td>John</td>
        <td>90</td>
    </tr>
</table>

</body>
</html>
