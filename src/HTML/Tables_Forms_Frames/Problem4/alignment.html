<!DOCTYPE html>
<html>
<head>
    <title>Alignment</title>
</head>
<body>

<h2>Text Alignment</h2>

<p align="left">This text is Left Aligned.</p>

<p align="center">This text is Center Aligned.</p>

<p align="right">This text is Right Aligned.</p>

<p align="justify">
This is a sample paragraph showing justified alignment. The text is aligned evenly along both the left and right margins.
</p>

</body>
</html>
