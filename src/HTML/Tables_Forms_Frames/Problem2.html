<!DOCTYPE html>
<html>
<head>
    <title>Visitor Information</title>
</head>
<body>

    <h2 align="center">Visitors Information</h2>
    <hr>

    <form>
        <table align="center" cellpadding="8">

            <tr>
                <td>Email Address:</td>
                <td><input type="email" name="email"></td>
            </tr>

            <tr>
                <td>User's Interest:</td>
                <td>
                    <input type="checkbox" name="interest" value="Research"> Research
                    <input type="checkbox" name="interest" value="Purchase"> Purchase
                </td>
            </tr>

            <tr>
                <td>Occupation:</td>
                <td>
                    <select name="occupation">
                        <option selected>Select One</option>
                        <option>Student</option>
                        <option>Employee</option>
                        <option>Business</option>
                        <option>Other</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Want us to send you junk emails?</td>
                <td>
                    <input type="radio" name="junk" value="Absolutely"> Absolutely
                    <input type="radio" name="junk" value="No Way Man"> No Way Man
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>

        </table>
    </form>

</body>
</html>
