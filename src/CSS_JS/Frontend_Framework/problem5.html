<!DOCTYPE html>
<html>
<head>
    <title>OnlineRead</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: white;
        }

        h1 {
            color: black;
        }

        .book {
            border: none;
            padding: 15px 30px;
            margin: 10px;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .all {
            background-color: white;
            color: black;
            border: 1px solid black;
        }

        .kids {
            background-color: darkblue;
        }

        .teens {
            background-color: green;
        }

        .scientific {
            background-color: lightblue;
            color: black;
        }

        .crime {
            background-color: orange;
        }

        .horror {
            background-color: red;
        }

        .feedback {
            background-color: gray;
            color: white;
            padding: 12px 25px;
            border: none;
            font-size: 18px;
        }

        .size {
            background-color: lightgray;
            border: 1px solid black;
            margin: 5px;
            padding: 10px 20px;
        }

        .big {
            font-size: 30px;
        }

        .medium {
            font-size: 24px;
        }

        .small {
            font-size: 18px;
        }

        .very-small {
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h1>OnlineRead</h1>

    <h2>Book Types</h2>

    <button class="book all">All</button>

    <button class="book kids">Kids</button>

    <button class="book teens">Teens</button>

    <button class="book scientific">Scientific</button>

    <button class="book crime">Crime</button>

    <button class="book horror">Horror</button>

    <br><br>

    <button class="feedback">Feedback</button>

    <h2>Font Size</h2>

    <button class="size big">Big</button>

    <button class="size medium">Medium</button>

    <button class="size small">Small</button>

    <button class="size very-small">Very Small</button>

</body>
</html>
