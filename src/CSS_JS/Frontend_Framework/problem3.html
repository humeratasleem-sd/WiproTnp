<!DOCTYPE html>
<html>
<head>
    <title>Food Calories</title>

    <style>
        table {
            border-collapse: collapse;
            width: 600px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        th {
            background-color: gray;
            color: white;
        }

        .green {
            background-color: lightgreen;
        }

        .blue {
            background-color: lightblue;
        }

        .orange {
            background-color: lightorange;
        }

        .red {
            background-color: lightcoral;
        }
    </style>
</head>

<body>

    <h2>Food Calories</h2>

    <table>
        <tr>
            <th>Food</th>
            <th>Calories</th>
        </tr>

        <tr class="green">
            <td>Apple</td>
            <td>95</td>
        </tr>

        <tr class="green">
            <td>Banana</td>
            <td>105</td>
        </tr>

        <tr class="blue">
            <td>Rice</td>
            <td>500</td>
        </tr>

        <tr class="blue">
            <td>Pizza</td>
            <td>650</td>
        </tr>

        <tr class="orange">
            <td>Biryani</td>
            <td>900</td>
        </tr>

        <tr class="orange">
            <td>Burger</td>
            <td>1100</td>
        </tr>

        <tr class="red">
            <td>Chocolate Cake</td>
            <td>1300</td>
        </tr>
    </table>

</body>
</html>
