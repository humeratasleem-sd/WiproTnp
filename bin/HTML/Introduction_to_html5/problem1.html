<!DOCTYPE html>
<html>
<head>
    <title>HTML5 Form</title>
</head>
<body>

    <h2>Registration Form</h2>

    <form>

        <!-- Email attribute -->
        <label>Email:</label>
        <input type="email"
               name="email"
               placeholder="Enter your email"
               required>
        <br><br>

        <!-- Multiple attribute -->
        <label>Select Emails:</label>
        <input type="email"
               name="emails"
               placeholder="Enter multiple emails"
               multiple
               required>
        <br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
