<!DOCTYPE html>
<html>
<head>
    <title>Ordered and Unordered Lists</title>
</head>
<body>

    <h2>Ordered List - Programming Languages</h2>
    <ol>
        <li>Java</li>
        <li>Python</li>
        <li>C</li>
        <li>C++</li>
        <li>JavaScript</li>
    </ol>

    <h2>Unordered List - Web Technologies</h2>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>React</li>
        <li>Bootstrap</li>
    </ul>

</body>
</html>
